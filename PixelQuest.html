<title>Pixel Quest: The Crystal Kingdom</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060e">
<meta name="description" content="A colorful retro-style 2D platform adventure. Run, jump, dash and energy-spin through five handcrafted worlds as Kiro, collecting crystals and awakening the Ancient Crystals to free the Crystal Kingdom.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060e; overflow: hidden; text-align: center;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: manipulation;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  #pqWrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #14183a 0%, #05060e 75%);
  }
  #pqCanvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; outline: none; background: #05060e;
    box-shadow: 0 0 42px rgba(80, 130, 255, 0.18);
    filter: saturate(1.18) contrast(1.08) brightness(1.04);
  }
  /* Graphics upgrade: cinematic color, depth and animated atmosphere. */
  #pqWrap::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 10;
    background:
      radial-gradient(circle at 50% 42%, rgba(120, 190, 255, 0.055) 0%, rgba(40, 70, 150, 0.025) 38%, rgba(0, 0, 0, 0.28) 100%),
      linear-gradient(180deg, rgba(80, 150, 255, 0.035), transparent 35%, rgba(0, 0, 0, 0.12));
    mix-blend-mode: screen;
    animation: pqAtmosphere 8s ease-in-out infinite alternate;
  }
  #pqWrap::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 11;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, 0.32) 100%);
  }
  @keyframes pqAtmosphere {
    0% { transform: scale(1); opacity: 0.82; }
    100% { transform: scale(1.045); opacity: 1; }
  }
  #pqBoot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    color: #cfe4ff; letter-spacing: 0.18em; font-size: 13px; text-transform: uppercase;
    background: #05060e; z-index: 50; transition: opacity 0.35s ease;
  }
  #pqBoot .spark {
    width: 46px; height: 46px; background: #78e6ff;
    box-shadow: 0 0 26px #46b7ff, 0 0 60px #2a6cff;
    animation: pqSpin 1.1s steps(8) infinite;
  }
  #pqBoot.gone { opacity: 0; pointer-events: none; }
  @keyframes pqSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #pqBoot small { opacity: 0.6; font-size: 10px; letter-spacing: 0.1em; }
</style>
</head>

      ctx.fillRect(x, y + 1, 5, 3);
