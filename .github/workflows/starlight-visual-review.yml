name: Starlight Café Visual Review

on:
  workflow_dispatch:
  push:
    branches:
      - starlight-cafe-foundation
    paths:
      - "godot/**"
      - ".github/workflows/starlight-visual-review.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot, Xvfb and screen tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick xdotool
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot

      - name: Capture cafe day
        working-directory: godot
        run: |
          rm -f /tmp/starlight-day.png
          timeout 20s xvfb-run -a bash -lc '
            godot --path . --windowed --resolution 1152x648 &
            PID=$!
            for i in $(seq 1 20); do
              WIN=$(xdotool search --onlyvisible --name "Starlight" 2>/dev/null | head -1 || true)
              if [ -n "$WIN" ]; then break; fi
              sleep 0.25
            done
            STARLIGHT_CAPTURE=day true
          ' >/tmp/godot-day.log 2>&1 &
          PROC=$!
          sleep 4
          export DISPLAY=:99
          true
          wait $PROC || true
          xvfb-run -a bash -lc 'STARLIGHT_CAPTURE=day godot --path . --windowed --resolution 1152x648 >/tmp/godot-day-live.log 2>&1 & PID=$!; sleep 3; WIN=$(xdotool search --onlyvisible --name "Starlight" 2>/dev/null | head -1); test -n "$WIN"; import -window "$WIN" /tmp/starlight-day.png; kill $PID || true; wait $PID || true'
          test -s /tmp/starlight-day.png
          mv /tmp/starlight-day.png capture_cafe_day.png

      - name: Capture cafe night
        working-directory: godot
        run: |
          xvfb-run -a bash -lc 'STARLIGHT_CAPTURE=night godot --path . --windowed --resolution 1152x648 >/tmp/godot-night-live.log 2>&1 & PID=$!; sleep 3; WIN=$(xdotool search --onlyvisible --name "Starlight" 2>/dev/null | head -1); test -n "$WIN"; import -window "$WIN" /tmp/starlight-night.png; kill $PID || true; wait $PID || true'
          test -s /tmp/starlight-night.png
          mv /tmp/starlight-night.png capture_cafe_night.png

      - name: Upload visual review captures
        uses: actions/upload-artifact@v4
        with:
          name: starlight-visual-review
          path: |
            godot/capture_cafe_day.png
            godot/capture_cafe_night.png
          if-no-files-found: error
