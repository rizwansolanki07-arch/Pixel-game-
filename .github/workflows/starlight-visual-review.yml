name: Starlight Café Visual Review

on:
  workflow_dispatch:
  push:
    branches:
      - starlight-cafe-foundation
    paths:
      - "godot/**"
      - ".github/workflows/starlight-visual-review.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.5 and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot

      - name: Capture cafe day/night frames
        working-directory: godot
        run: |
          xvfb-run -a godot --path . --script tools/capture_starlight.gd

      - name: Upload visual review captures
        uses: actions/upload-artifact@v4
        with:
          name: starlight-visual-review
          path: |
            godot/capture_cafe_day.png
            godot/capture_cafe_night.png
          if-no-files-found: error
