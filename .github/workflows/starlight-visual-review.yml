name: Starlight Café Visual Review

on:
  workflow_dispatch:
  push:
    branches:
      - starlight-cafe-foundation
    paths:
      - "godot/**"
      - ".github/workflows/starlight-visual-review.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and X11 capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot

      - name: Capture cafe day
        working-directory: godot
        run: |
          rm -f capture_cafe_day.png
          set +e
          timeout 15s xvfb-run -a bash -lc 'godot --path . --windowed --resolution 1152x648 >/tmp/starlight-day.log 2>&1 & PID=$!; WIN=""; for i in $(seq 1 40); do WIN=$(xdotool search --onlyvisible --name "Starlight" 2>/dev/null | head -1); [ -n "$WIN" ] && break; sleep 0.25; done; if [ -n "$WIN" ]; then xdotool windowactivate "$WIN"; xdotool key e; sleep 1; import -window "$WIN" capture_cafe_day.png; fi; kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true'
          CODE=$?
          cat /tmp/starlight-day.log
          echo "capture_code=$CODE"
          test -s capture_cafe_day.png

      - name: Capture cafe night
        working-directory: godot
        run: |
          rm -f capture_cafe_night.png
          set +e
          timeout 15s xvfb-run -a bash -lc 'godot --path . --windowed --resolution 1152x648 >/tmp/starlight-night.log 2>&1 & PID=$!; WIN=""; for i in $(seq 1 40); do WIN=$(xdotool search --onlyvisible --name "Starlight" 2>/dev/null | head -1); [ -n "$WIN" ] && break; sleep 0.25; done; if [ -n "$WIN" ]; then xdotool windowactivate "$WIN"; xdotool key e; sleep 1; xdotool key n; sleep 0.8; import -window "$WIN" capture_cafe_night.png; fi; kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true'
          CODE=$?
          cat /tmp/starlight-night.log
          echo "capture_code=$CODE"
          test -s capture_cafe_night.png

      - name: Upload visual review captures and logs
        uses: actions/upload-artifact@v4
        with:
          name: starlight-visual-review
          path: |
            godot/capture_cafe_day.png
            godot/capture_cafe_night.png
            /tmp/starlight-day.log
            /tmp/starlight-night.log
          if-no-files-found: error
