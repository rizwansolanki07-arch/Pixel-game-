name: Build Starlight Café Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - starlight-cafe-foundation
  pull_request:
    branches:
      - main
      - starlight-cafe-foundation

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.5
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.5.stable/

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate project
        working-directory: godot
        run: godot --headless --editor --quit

      - name: Export Starlight Café APK
        working-directory: godot
        run: godot --headless --path . --export-debug "Android" ../Starlight-Cafe-debug.apk

      - name: Upload Starlight Café APK
        uses: actions/upload-artifact@v4
        with:
          name: Starlight-Cafe-APK
          path: Starlight-Cafe-debug.apk
          if-no-files-found: error
