name: Build Chanderi Quest Godot APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-godot-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.1-stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        shell: bash
        run: |
          set -e
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/export_templates/4.5.1.stable" ]; then
            cp -a /root/.local/share/godot/export_templates/4.5.1.stable ~/.local/share/godot/export_templates/
          fi

      - name: Verify Godot project
        working-directory: godot
        run: |
          godot --headless --editor --quit --path . --verbose

      - name: Export Android APK
        working-directory: godot
        run: |
          mkdir -p ../build/android
          godot --headless --path . --export-debug "Android" ../build/android/ChanderiQuest-debug.apk

      - name: Upload Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: Chanderi-Quest-Godot-APK
          path: build/android/ChanderiQuest-debug.apk
          if-no-files-found: error

      - name: Publish Godot APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chanderi-godot-apk-${{ github.run_number }}
          name: Chanderi Quest Godot APK (build ${{ github.run_number }})
          body: "Native Godot Android debug APK for Chanderi Quest."
          files: build/android/ChanderiQuest-debug.apk
