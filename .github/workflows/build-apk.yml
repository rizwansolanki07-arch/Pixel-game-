name: Build Pixel Quest APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project
        run: |
          if [ -f PixelQuest-Mobile.zip ]; then
            unzip -q -o PixelQuest-Mobile.zip
          else
            echo "No PixelQuest-Mobile.zip in the repo root."
            exit 1
          fi

      - name: Sync source game and premium assets
        run: |
          targets=( $(find . -type f -path '*/app/src/main/assets/PixelQuest.html') )
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::No packaged PixelQuest.html found."
            exit 1
          fi
          for html in "${targets[@]}"; do
            cp -f PixelQuest.html "$html"
            asset_dir="$(dirname "$html")/src/art/assets/premium/kenney"
            mkdir -p "$asset_dir"
            cp -f src/art/assets/premium/kenney/* "$asset_dir/"
            echo "Synced $html and premium art -> $asset_dir"
          done

      - name: Upgrade game graphics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = list(Path('.').glob('**/app/src/main/assets/PixelQuest.html'))
          if not targets:
              print('No packaged PixelQuest.html found; skipping graphics patch.')
              raise SystemExit(0)
          css_old = '''  #pqCanvas {\n    display: block; image-rendering: pixelated; image-rendering: crisp-edges;\n    touch-action: none; outline: none; background: #05060e;\n    box-shadow: 0 0 42px rgba(80, 130, 255, 0.18);\n  }'''
          css_new = '''  #pqCanvas {\n    display: block; image-rendering: pixelated; image-rendering: crisp-edges;\n    touch-action: none; outline: none; background: #05060e;\n    box-shadow: 0 0 42px rgba(80, 130, 255, 0.18);\n    filter: saturate(1.18) contrast(1.08) brightness(1.04);\n  }\n  /* Graphics polish: cinematic vignette + soft atmospheric bloom without changing gameplay. */\n  #pqWrap::after {\n    content: ''; position: absolute; inset: 0; pointer-events: none;\n    background:\n      radial-gradient(circle at 50% 45%, rgba(120, 190, 255, 0.055) 0%, rgba(40, 70, 150, 0.025) 38%, rgba(0, 0, 0, 0.28) 100%),\n      linear-gradient(180deg, rgba(80, 150, 255, 0.035), transparent 35%, rgba(0, 0, 0, 0.12));\n    mix-blend-mode: screen;\n  }\n  #pqWrap::before {\n    content: ''; position: absolute; inset: 0; pointer-events: none;\n    background: radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, 0.32) 100%);\n  }'''
          for p in targets:
              s = p.read_text(encoding='utf-8')
              if css_new not in s:
                  if css_old not in s:
                      print(f'Expected renderer CSS not found in {p}; leaving unchanged.')
                      continue
                  s = s.replace(css_old, css_new, 1)
                  p.write_text(s, encoding='utf-8')
                  print(f'Graphics polish applied to {p}')
          PY

      - name: Find the Android project
        id: locate
        run: |
          for d in android PixelQuest-Mobile/android .; do
            if [ -f "$d/gradlew" ] && [ -f "$d/settings.gradle" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No Gradle project found."
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build installable APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelQuest-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Pixel Quest APK (build ${{ github.run_number }})
          body: "Installable Pixel Quest APK."
          files: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
