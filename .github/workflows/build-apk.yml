name: Build Chanderi Quest APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Chanderi Quest installable APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Chanderi APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chanderi-Quest-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Chanderi APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chanderi-apk-${{ github.run_number }}
          name: Chanderi Quest APK (build ${{ github.run_number }})
          body: "Installable Chanderi Quest Android APK. Offline build from the Chanderi Quest Android project."
          files: android/app/build/outputs/apk/debug/app-debug.apk
