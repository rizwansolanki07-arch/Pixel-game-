name: Build Chanderi Quest Godot APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-godot-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jdk
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          sudo install -m 0755 Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O sdk.zip
          unzip -q sdk.zip
          mv cmdline-tools latest
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot Android templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz
          echo "Godot export template files:"
          find templates -maxdepth 2 -type f -print
          cp -a templates/* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

      - name: Configure Android paths and debug keystore
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -alias androiddebugkey             -keyalg RSA             -keysize 2048             -validity 10000             -storepass android             -keypass android             -dname "CN=Android Debug,O=Android,C=US"             -noprompt
          printf '%s\n'             '[gd_resource type="EditorSettings" format=3]'             '[resource]'             'export/android/android_sdk_path = "'$HOME'/android-sdk"'             'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"'             > "$HOME/.config/godot/editor_settings-4.tres"
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          adb version
          java -version
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Verify project
        working-directory: godot
        run: godot --headless --editor --quit --path .

      - name: Runtime smoke test
        working-directory: godot
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee ../runtime-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" ../runtime-smoke.log; then
            echo "Runtime smoke test found a Godot error."
            exit 1
          fi
          grep -q "CHANDERI_RUNTIME_OK: Main._ready entered" ../runtime-smoke.log
          echo "Runtime smoke test passed."

      - name: Export Android APK
        working-directory: godot
        run: |
          set -euxo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p ../build/android
          godot --headless --path . --export-debug "Android" ../build/android/ChanderiQuest-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chanderi-Quest-Godot-APK
          path: build/android/ChanderiQuest-debug.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chanderi-godot-apk-${{ github.run_number }}
          name: Chanderi Quest Godot APK (build ${{ github.run_number }})
          body: "Native Godot Android debug APK for Chanderi Quest."
          files: build/android/ChanderiQuest-debug.apk
