<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Aether Resonance</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b10}body{display:grid;place-items:center;font-family:monospace}#w{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw)}canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}#hud{position:absolute;left:8px;top:8px;color:#d8fff4;background:#071019d9;border:1px solid #42615e;padding:6px 8px;font-size:7px;min-width:170px}#hud i{display:block;height:4px;background:#1c2930;margin:2px 0 4px}#hp{background:#e65d6c;width:100%;height:100%}#ae{background:#63e1c9;width:0;height:100%}.touch{display:none;position:absolute;inset:auto 9px 9px;justify-content:space-between;pointer-events:auto}.b{width:28px;height:28px;border:1px solid #78908c55;background:#07101977;color:#d8fff4;display:grid;place-items:center;font:7px monospace}.grp{display:flex;gap:5px;align-items:end}@media(pointer:coarse){.touch{display:flex}}</style></head><body><div id="w"><canvas id="c" width="384" height="216"></canvas><div id="hud">HP <i><b id="hp"></b></i>AETHER <i><b id="ae"></b></i><span id="st">THE WHISPERING WOODS · 0/3</span></div><div class="touch"><div class="grp"><div class="b" data-k="ArrowLeft">◀</div><div class="b" data-k="ArrowDown">▼</div><div class="b" data-k="ArrowRight">▶</div><div class="b" data-k="ArrowUp">▲</div></div><div class="grp"><div class="b" data-k="KeyJ">ATK</div><div class="b" data-k="KeyK">DASH</div><div class="b" data-k="KeyQ">AE</div></div></div></div><script>
const C=document.getElementById('c'),x=C.getContext('2d'),W=384,H=216,A='src/art/assets/modern/';x.imageSmoothingEnabled=false;
const I={bg:new Image(),far:new Image(),near:new Image(),hero:new Image(),gob:new Image(),zom:new Image(),rea:new Image()};Object.assign(I,{bg:Object.assign(I.bg,{src:A+'bg_base.png'}),far:Object.assign(I.far,{src:A+'bg_layer_2.png'}),near:Object.assign(I.near,{src:A+'bg_layer_3.png'}),hero:Object.assign(I.hero,{src:A+'knight_idle.png'}),gob:Object.assign(I.gob,{src:A+'goblin_idle.png'}),zom:Object.assign(I.zom,{src:A+'zombie_idle.png'}),rea:Object.assign(I.rea,{src:A+'reaper_idle.png'})});
const key={},touch={};addEventListener('keydown',e=>{key[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>key[e.code]=0);
document.querySelectorAll('.b').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();touch[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();touch[k]=0}});
const down=k=>key[k]||touch[k], P={x:190,y:150,vx:0,vy:0,hp:100,ae:0,dir:0,atk:0,dash:0,cd:0,inv:0}, E=[];
for(let i=0;i<9;i++)E.push({x:90+(i%3)*110,y:72+Math.floor(i/3)*42,t:i%3,hp:30,cd:0,dead:0});
let camx=0,camy=0,shards=0,started=0,last=performance.now(),shake=0;
function ready(im){return im.complete&&im.naturalWidth}
function sprite(im,X,Y,w,h,fr=0){if(!ready(im))return;let fh=im.naturalHeight||128,n=Math.max(1,Math.floor(im.naturalWidth/fh)),fw=im.naturalWidth/n,f=fr%n;x.drawImage(im,f*fw,0,fw,fh,X,Y,w,h)}
function bg(){x.fillStyle='#09121a';x.fillRect(0,0,W,H);if(ready(I.bg))x.drawImage(I.bg,0,0,W,H);if(ready(I.far))x.globalAlpha=.72,x.drawImage(I.far,(camx*.12)%W- W,0,W,H),x.drawImage(I.far,(camx*.12)%W,0,W,H);if(ready(I.near))x.globalAlpha=.45,x.drawImage(I.near,(camx*.22)%W-W,0,W,H),x.drawImage(I.near,(camx*.22)%W,0,W,H);x.globalAlpha=1}
function attack(){if(P.atk<=0){P.atk=.22;for(const e of E)if(!e.dead&&Math.hypot(e.x-P.x,e.y-P.y)<30){e.hp-=18;P.ae=Math.min(100,P.ae+18);if(e.hp<=0){e.dead=1;shards++}}}}
function update(dt){if(!started)return;if(P.cd>0)P.cd-=dt;if(P.inv>0)P.inv-=dt;if(P.atk>0)P.atk-=dt;if(down('KeyJ'))attack();if(down('KeyK')&&P.cd<=0){P.dash=.16;P.cd=.65;P.inv=.22}if(P.dash>0)P.dash-=dt;let dx=(down('ArrowRight')?1:0)-(down('ArrowLeft')?1:0),dy=(down('ArrowDown')?1:0)-(down('ArrowUp')?1:0);if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;P.dir=Math.atan2(dy,dx)}let sp=P.dash>0?190:62;P.x+=dx*sp*dt;P.y+=dy*sp*dt;P.x=Math.max(28,Math.min(356,P.x));P.y=Math.max(48,Math.min(190,P.y));if(P.ae>=100&&down('KeyQ')){P.ae=0;P.inv=2.5;P.atk=.8}for(const e of E){if(e.dead)continue;let dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);if(d<100&&P.inv<=0){e.x+=dx/d*18*dt;e.y+=dy/d*18*dt;if(d<18){P.hp-=9*dt;P.ae=Math.min(100,P.ae+4*dt)}}}camx+=(P.x-192-camx)*Math.min(1,dt*5);camy+=(P.y-108-camy)*Math.min(1,dt*5);if(P.hp<=0)P.hp=100}
function draw(){bg();x.save();x.translate(-camx*.35,-camy*.2);for(let i=0;i<12;i++){x.fillStyle=i%2?'#162e2a':'#193a31';x.fillRect(i*45,184-(i%3)*3,45,32)}x.restore();x.save();x.translate(-camx,-camy);for(const e of E){if(e.dead)continue;let im=e.t===0?I.gob:e.t===1?I.zom:I.rea;let s=e.t===2?42:38;sprite(im,e.x-s/2,e.y-s,s,s)}sprite(I.hero,P.x-22,P.y-44,44,44);if(P.atk>0){x.strokeStyle='#b9fff0';x.lineWidth=2;x.beginPath();x.arc(P.x,P.y-20,26,-.9+P.dir,.2+P.dir);x.stroke()}x.restore();document.getElementById('hp').style.width=P.hp+'%';document.getElementById('ae').style.width=P.ae+'%';document.getElementById('st').textContent='THE WHISPERING WOODS · '+shards+'/9';}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}document.addEventListener('pointerdown',()=>started=1);document.addEventListener('keydown',e=>{if(e.code==='Enter'||e.code==='Space')started=1});requestAnimationFrame(loop);
</script></body></html>
